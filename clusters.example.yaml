# clusters.yaml schema (this file is the doc + example; the real file is
# clusters.yaml, gitignored, hand-authored/updated by each run -- no parser
# needed, it's read by the LLM doing the run).
#
# Fields per entry:
#   id           kebab-slug, stable across runs (never renamed once evidence
#                references it)
#   title        short human label
#   status       new | fix-applied | monitor | wont-fix | resolved
#                  - new: just clustered, no fix decided/applied yet
#                  - fix-applied: a fix was applied -- NOT proof it operates.
#                    Use this by default after "Applied <date>" work; only
#                    move to resolved once a later run's digests show the
#                    wired_check actually holds.
#                  - monitor: recurrence too low to act on, or already
#                    covered and just being watched
#                  - wont-fix: decided against, with rationale
#                  - resolved: explicit non-recurrence evidence from a later
#                    run (not just "we shipped code for it")
#   first_seen   date cluster first appeared
#   last_seen    date of most recent run that still saw evidence for it
#   sessions     approximate count of sessions involved
#   projects     list of project dirs/names touched
#   evidence     list of session basenames (short ids) that cite this cluster
#   fix          one line: what was/would be changed. Empty string if none.
#   wired_check  one line: how to verify the fix actually OPERATES in later
#                digests (not just that it exists in the repo). Empty if n/a.

- id: recording-health-check-not-wired
  title: "Built health-check script never actually invoked by the watchdog"
  status: fix-applied
  first_seen: 2026-07-11
  last_seen: 2026-07-20
  sessions: 3
  projects: [photo-tagger]
  evidence: [agent-701a7b5f270123cad, 1838b72b]
  fix: "wired scripts/recording_health.py into the live_capture_gate.sh watchdog loop (stall check per cycle)"
  wired_check: "next window's digests show recording_health.py actually invoked/logged during a run, not just present in the repo"

- id: background-task-opacity
  title: "Long unattended runs give no progress signal, user asks 'is it stuck?'"
  status: monitor
  first_seen: 2026-06-30
  last_seen: 2026-07-20
  sessions: 9
  projects: [photo-tagger, recipe-box, garden-planner, weather-widget]
  evidence: [d13e3a2d, 0e7d8cea, 8f8d9dcb, 7412b54a]
  fix: "CLAUDE.md heartbeat rule (2026-07-11), extended to external CLI timeout+liveness and verbatim-in-subagent-prompts (2026-07-20)"
  wired_check: "next window's digests contain zero 'is it stuck'/'is the shell stuck' user messages and no background run silent for >10 min"
